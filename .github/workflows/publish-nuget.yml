name: publish-nuget

# Publishes sk0ya.Editor.Controls to nuget.org via Trusted Publishing (no stored API key).
# The nuget.org policy must name this repository (sk0ya/Editor) and this file (publish-nuget.yml).
# The version is whatever <Version> the Defaults .csproj carries at the given ref — bump and commit first.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit / branch / tag to publish (the bump commit)
        required: false
        default: main
        type: string

permissions:
  contents: read
  id-token: write   # Trusted Publishing: GitHub OIDC token -> short-lived NuGet key

jobs:
  publish:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Test (Core)
        run: dotnet test tests/Editor.Core.Tests/Editor.Core.Tests.csproj -c Release

      - name: Pack
        run: dotnet pack src/Editor.Controls.Defaults/Editor.Controls.Defaults.csproj -c Release -o artifacts

      - name: Verify package
        id: verify
        shell: pwsh
        run: |
          $pkg = Get-ChildItem artifacts/sk0ya.Editor.Controls.*.nupkg | Select-Object -First 1
          if (-not $pkg) { throw 'No package produced.' }
          $sha = git rev-parse HEAD
          $dir = Join-Path $env:RUNNER_TEMP 'nupkg-check'
          Expand-Archive $pkg.FullName $dir
          $version = ([xml](Get-Content (Join-Path $dir 'sk0ya.Editor.Controls.nuspec'))).package.metadata.version
          $dlls = Get-ChildItem (Join-Path $dir 'lib') -Recurse -Filter *.dll
          if ($dlls.Count -lt 4) { throw "Expected 4 DLLs, found $($dlls.Count)." }
          foreach ($d in $dlls) {
            $pv = [Diagnostics.FileVersionInfo]::GetVersionInfo($d.FullName).ProductVersion
            "$($d.Directory.Name)/$($d.Name) $pv"
            if ($pv -ne "$version+$sha") { throw "$($d.Name): ProductVersion $pv != $version+$sha" }
          }
          "package=$($pkg.FullName)" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: NuGet login (Trusted Publishing)
        id: login
        uses: NuGet/login@v1
        with:
          user: ShigekazuKoya

      - name: Push to nuget.org
        run: dotnet nuget push "${{ steps.verify.outputs.package }}" --source https://api.nuget.org/v3/index.json --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
